<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.4"/>

  <circle cx="256" cy="256" r="160" fill="#10b981" opacity="0.15" filter="url(#glow)"/>

  <path d="M 285 105 C 170 105 110 195 110 300 C 110 395 185 435 275 425 C 200 405 160 340 160 270 C 160 185 220 125 285 105 Z" fill="url(#emeraldGrad)"/>

  <circle cx="230" cy="275" r="75" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round"/>
  <circle cx="310" cy="275" r="75" fill="none" stroke="url(#emeraldGrad)" stroke-width="24" stroke-linecap="round"/>

  <path d="M 270 230 C 270 210 285 195 300 195 C 315 195 330 210 330 230 C 330 255 270 290 270 290 C 270 290 210 255 210 230 C 210 210 225 195 240 195 C 255 195 270 210 270 230 Z" fill="url(#goldGrad)" opacity="0.95" filter="url(#glow)"/>

  <g transform="translate(365, 135) scale(1.4)">
    <path d="M0 -15 L4 -4 L15 0 L4 4 L0 15 L-4 4 L-15 0 L-4 -4 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  <g transform="translate(145, 125) scale(0.9)">
    <path d="M0 -15 L4 -4 L15 0 L4 4 L0 15 L-4 4 L-15 0 L-4 -4 Z" fill="url(#goldGrad)"/>
  </g>
</svg>